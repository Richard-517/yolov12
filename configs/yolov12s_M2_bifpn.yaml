# CMDrill-YOLOv12 — Improvement 2 (BiFPN + P2 small-object head).
# - All neck Concat nodes replaced with BiFPN_Add2/BiFPN_Add3 (weighted fusion).
# - New P2 detection head (stride 4, 160×160 grid at imgsz=640).
# - 4 detection heads total (P2/P3/P4/P5).
# Channel counts annotated below assume scale='s' (width=0.5).

nc: 6
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv,  [64, 3, 2]]           # 0  P1/2
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]    # 1  P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]   # 2  P2 source    (scale-s: 128ch)
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]    # 3  P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]   # 4  P3 source    (scale-s: 256ch)
  - [-1, 1, Conv,  [512, 3, 2]]          # 5  P4/16
  - [-1, 4, A2C2f, [512, True, 4]]       # 6  P4 source    (scale-s: 256ch)
  - [-1, 1, Conv,  [1024, 3, 2]]         # 7  P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]      # 8  P5 source    (scale-s: 512ch)

head:
  # -------- Top-down: P5 -> P4 -> P3 -> P2 --------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 9   P5 up              (scale-s: 512ch, 40x40)
  - [[-1, 6], 1, BiFPN_Add2, [512]]                # 10  fuse (9, 6)        (scale-s: 256ch)
  - [-1, 2, A2C2f, [512, False, -1]]               # 11  P4-top             (scale-s: 256ch)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 12                     (scale-s: 256ch, 80x80)
  - [[-1, 4], 1, BiFPN_Add2, [256]]                # 13  fuse (12, 4)       (scale-s: 128ch)
  - [-1, 2, A2C2f, [256, False, -1]]               # 14  P3-top             (scale-s: 128ch)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 15                     (scale-s: 128ch, 160x160)
  - [[-1, 2], 1, BiFPN_Add2, [128]]                # 16  fuse (15, 2)       (scale-s: 64ch)
  - [-1, 2, C3k2, [128, False]]                    # 17  P2-out (small-obj) (scale-s: 64ch)

  # -------- Bottom-up: P2 -> P3 -> P4 -> P5 --------
  - [-1, 1, Conv, [128, 3, 2]]                     # 18  down              (scale-s: 64ch, 80x80)
  - [[-1, 14, 4], 1, BiFPN_Add3, [256]]            # 19  fuse (18, 14, 4)  (scale-s: 128ch)
  - [-1, 2, A2C2f, [256, False, -1]]               # 20  P3-out            (scale-s: 128ch)

  - [-1, 1, Conv, [256, 3, 2]]                     # 21  down              (scale-s: 128ch, 40x40)
  - [[-1, 11, 6], 1, BiFPN_Add3, [512]]            # 22  fuse (21, 11, 6)  (scale-s: 256ch)
  - [-1, 2, A2C2f, [512, False, -1]]               # 23  P4-out            (scale-s: 256ch)

  - [-1, 1, Conv, [512, 3, 2]]                     # 24  down              (scale-s: 256ch, 20x20)
  - [[-1, 8], 1, BiFPN_Add2, [1024]]               # 25  fuse (24, 8)      (scale-s: 512ch)
  - [-1, 2, C3k2, [1024, True]]                    # 26  P5-out            (scale-s: 512ch)

  - [[17, 20, 23, 26], 1, Detect, [nc]]            # 27  4-head Detect (P2/P3/P4/P5)
