# CMDrill-YOLOv12s — full method (M4).
# Combines:
#   - M1 DS-A2C2f: DSConv dual-morph branch on backbone indices 6, 8
#   - M2 BiFPN + P2: weighted bidirectional fusion + 160x160 small-object head
#   - M3 Inner-MPDIoU loss + CIoU warmup (enabled via training args:
#         iou_type=inner_mpdiou, inner_ratio=0.7, ciou_warmup_epochs=10)

nc: 6
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv,  [64, 3, 2]]           # 0
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]    # 1
  - [-1, 2, C3k2,  [256, False, 0.25]]   # 2  P2 source
  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]    # 3
  - [-1, 2, C3k2,  [512, False, 0.25]]   # 4  P3 source
  - [-1, 1, Conv,  [512, 3, 2]]          # 5
  - [-1, 4, DS_A2C2f, [512, True, 4]]    # 6  P4 source  ← DS_A2C2f (M1)
  - [-1, 1, Conv,  [1024, 3, 2]]         # 7
  - [-1, 4, DS_A2C2f, [1024, True, 1]]   # 8  P5 source  ← DS_A2C2f (M1)

head:
  # Top-down: P5 → P4 → P3 → P2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 9
  - [[-1, 6], 1, BiFPN_Add2, [512]]                # 10
  - [-1, 2, A2C2f, [512, False, -1]]               # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 12
  - [[-1, 4], 1, BiFPN_Add2, [256]]                # 13
  - [-1, 2, A2C2f, [256, False, -1]]               # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 15
  - [[-1, 2], 1, BiFPN_Add2, [128]]                # 16
  - [-1, 2, C3k2, [128, False]]                    # 17  P2 output

  # Bottom-up: P2 → P3 → P4 → P5
  - [-1, 1, Conv, [128, 3, 2]]                     # 18
  - [[-1, 14, 4], 1, BiFPN_Add3, [256]]            # 19
  - [-1, 2, A2C2f, [256, False, -1]]               # 20  P3 output

  - [-1, 1, Conv, [256, 3, 2]]                     # 21
  - [[-1, 11, 6], 1, BiFPN_Add3, [512]]            # 22
  - [-1, 2, A2C2f, [512, False, -1]]               # 23  P4 output

  - [-1, 1, Conv, [512, 3, 2]]                     # 24
  - [[-1, 8], 1, BiFPN_Add2, [1024]]               # 25
  - [-1, 2, C3k2, [1024, True]]                    # 26  P5 output

  - [[17, 20, 23, 26], 1, Detect, [nc]]
